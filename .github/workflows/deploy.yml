# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          # Optional overrides. Add these under Settings > Secrets and variables > Actions > Variables.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_BOOKING_URL: ${{ vars.PUBLIC_BOOKING_URL }}
          PUBLIC_FOUNDER_LINKEDIN: ${{ vars.PUBLIC_FOUNDER_LINKEDIN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
